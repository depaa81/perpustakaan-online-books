<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Perpustakaan Online</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container" id="loginBox">
  <h2>Login Admin</h2>
  <form id="loginForm">
    <input type="text" id="username" placeholder="Username (admin)" required>
    <input type="password" id="password" placeholder="Password" required>
    <button type="submit">Masuk</button>
  </form>
  <button onclick="window.location.href='index.html'">Kembali</button>
</div>

<div class="container hidden" id="adminPage">
  <h2>📚 Halaman Admin</h2>
  <button onclick="logout()">Keluar</button>

  <h3>Tambah Buku Digital</h3>
  <input type="text" id="bookTitle" placeholder="Judul Buku">
  <input type="url" id="bookLink" placeholder="Link Digital Book">
  <button onclick="addBook()">Tambah Buku</button>

  <div class="book-list" id="adminBookList"></div>

  <hr>

  <h3>Ganti Password Admin</h3>
  <input type="password" id="oldPass" placeholder="Password Lama">
  <input type="password" id="newPass" placeholder="Password Baru">
  <input type="password" id="confirmPass" placeholder="Konfirmasi Password Baru">
  <button onclick="changePassword()">Ganti Password</button>
</div>

<script src="script.js"></script>
</body>
</html>
