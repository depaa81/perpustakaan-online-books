<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Perpustakaan Online</title>
  <link rel="stylesheet" href="./style.css" />
  <script src="./script.js" defer></script>
</head>
<body>
  <header>
    <h1>📚 Perpustakaan Online</h1>
    <input type="text" id="searchInput" placeholder="Cari judul buku..." />
    <label class="switch">
  <input type="checkbox" id="toggle-dark">
  <span class="slider"></span>
</label>

  </header>

  <main>
    <div class="filter">
      <button class="filter-btn active" data-category="all">Semua</button>
      <button class="filter-btn" data-category="Pemrograman">Pemrograman</button>
      <button class="filter-btn" data-category="Novel">Novel</button>
      <button class="filter-btn" data-category="Teknologi">Teknologi</button>
      <button id="showFavorites">❤️ Favorit</button>
    </div>

    <ul id="bookList"></ul>
  </main>

  <footer>
    <p>Perpustakaan Online © 2025</p>
  </footer>
</body>
</html>
