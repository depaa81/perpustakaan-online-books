<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Perpustakaan Online</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>📚 Perpustakaan Online</h1>
  </header>

  <main>
    <div class="search-container">
      <input type="text" id="searchInput" placeholder="Cari buku..." />
      <button id="toggleDarkMode" class="darkmode-btn">
        <span class="icon">🌙</span>
      </button>
    </div>

    <div class="filter-container">
      <button class="filter-btn active" data-category="all">Semua</button>
      <button class="filter-btn" data-category="Novel">Novel</button>
      <button class="filter-btn" data-category="Non-Fiksi">Non-Fiksi</button>
      <button class="filter-btn" data-category="Teknologi">Teknologi</button>
      <button id="favoritesBtn" class="filter-btn">❤️ Favorit</button>
    </div>

    <div id="book-list" class="book-list"></div>
  </main>

  <script src="script.js"></script>
</body>
</html>
